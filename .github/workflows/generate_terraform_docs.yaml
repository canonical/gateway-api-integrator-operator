name: Generate terraform docs

on:
  push:
    branches:
      - main
    paths:
      - "**/terraform/**"
      - ".github/workflows/generate_terraform_docs.yaml"

permissions:
  contents: write
  pull-requests: write

jobs:
  terraform-docs:
    uses: canonical/operator-workflows/.github/workflows/generate_terraform_docs.yaml@5f7c5ae8edce88c84ce33ac9674995fa551e3e75 # main
    with:
      terraform-directory: "terraform/modules/gateway-api-integrator,terraform/product"

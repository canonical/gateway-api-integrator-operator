type: charm
base: ubuntu@24.04
build-base: ubuntu@24.04

platforms:
  amd64:
  arm64:
parts:
  charm:
    source: .
    plugin: uv
    build-snaps:
    - astral-uv
    build-packages:
      - build-essential
      - python3-dev
      - pkg-config
      - libffi-dev
      - libssl-dev

name: gateway-api-integrator
title: Gateway API Integrator
description: |
  A [Juju](https://juju.is/) [charm](https://juju.is/docs/olm/charmed-operators) deploying and managing external access to HTTP/HTTPS services in a
  Kubernetes cluster via a Gateway and an HTTPRoute resource. This requires the Kubernetes
  cluster in question to have an Gateway API controller already deployed into it.
summary: An operator to manage gateway resources.
links:
  documentation: https://canonical.com/juju/docs/gateway-api-integrator-charm/
  issues: https://github.com/canonical/gateway-api-integrator-operator/issues
  source: https://github.com/canonical/gateway-api-integrator-operator
  contact:
    - https://launchpad.net/~canonical-is-devops
assumes:
  - k8s-api
  - juju >= 3.3
requires:
  certificates:
    interface: tls-certificates
    limit: 1
  dns-record:
    interface: dns_record
provides:
  gateway:
    interface: ingress
    limit: 1
  gateway-route:
    interface: gateway-route

config:
  options:
    external-hostname:
      description: The hostname of the gateway.
      type: string
    gateway-class:
      description: The gateway class.
      type: string
    enforce-https:
      default: true
      description: |
        Whether to enforce HTTPS by redirecting HTTP traffic to HTTPS.
        When set to false, plain HTTP traffic on port 80 is allowed and the HTTPS listener is not created.
        Setting this to false also makes the external-hostname configuration optional.
      type: boolean
    hsts-max-age:
      default: 31536000
      description: |
        Value for the max-age directive of the Strict-Transport-Security header injected on HTTPS routes.
        Only applied when HTTPS is enforced. The default is 31536000 (1 year).
        Setting this to 0 instructs browsers to clear any cached HSTS policy.
      type: int
    csr-subject-attributes:
      description: |
        Optional CSR subject attributes to include when requesting certificates from the
        `certificates` relation. The value must be a comma-separated list of X.500-style
        key-value pairs such as `C=DE, ST=Hesse, L=Berlin, O=Canonical, OU=Engineering`.

        Supported keys are `CN`, `C`, `ST`, `L`, `O`, `OU`, and `emailAddress`.
        `CN` overrides the CSR common name that would otherwise be derived from
        `external-hostname` or the gateway address.
      type: string
    extra-routes:
      description: |
        Optional JSON list of statically configured routes to Services in the charm's model,
        served by the Gateway independently of the `gateway` and `gateway-route` relations.
        Each entry has the keys `name` (DNS label), `protocol` (`http`, `tcp`, `tls-terminate`
        or `udp`), `service`, `service_port` and, depending on the protocol, `hostnames`
        (required for `http` and `tls-terminate`), `path_prefix` and `strip_prefix` (`http`),
        and `port` (the Gateway listener port, required for `tcp`, `tls-terminate` and `udp`).
        HTTP route hostnames are added to the certificate requests and Gateway listeners;
        `tls-terminate` routes use the certificate of their first hostname.
        TCP and UDP routes require a gateway class that serves TCPRoute and UDPRoute.
        Example:
        `[{"name": "ui", "protocol": "http", "hostnames": ["ui.example.com"], "service": "ui", "service_port": 8080},
        {"name": "mqtts", "protocol": "tls-terminate", "hostnames": ["ui.example.com"], "port": 8883, "service": "emqx", "service_port": 1883}]`
      type: string
    external-ips:
      description: |
        Optional comma separated list of IP addresses requested for the Gateway
        (`Gateway.spec.addresses`), for example a floating IP on bare metal.
      type: string


actions:
  get-certificate:
    description: Returns the TLS Certificate. Intended for testing and debugging purposes.
    params:
      hostname:
        type: string
        description: Hostname to extract certs from.
  get-proxied-endpoints:
    description: |
      Returns a list of endpoints, including the gateway endpoint and endpoints
      proxied for applications integrated through the ingress relation.

name: Tag gateway-api-integrator Terraform module

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'terraform/modules/gateway-api-integrator/VERSION'

jobs:
  tag:
    uses: ./.github/workflows/tag_terraform_module.yaml
    permissions:
      contents: write
    with:
      module-directory: terraform/modules/gateway-api-integrator
      tag-prefix: tf-gateway-api-integrator

name: Terraform CC008 compliance check

# Reusable workflow. Authored here so it can be promoted to
# canonical/operator-workflows; the checker script is bundled at
# terraform/compliance/cc008_check.py. When promoted, add a checkout step for
# the operator-workflows repository to obtain the checker script.
on:
  workflow_call:
    inputs:
      terraform-directories:
        description: "JSON array of Terraform module directories to check."
        required: true
        type: string
      python-version:
        description: "Python version used to run the checker."
        required: false
        default: "3.12"
        type: string

jobs:
  cc008-compliance:
    name: CC008 compliance
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install checker dependencies
        run: pip install python-hcl2
      - name: Run CC008 compliance check
        run: >-
          python terraform/compliance/cc008_check.py
          ${{ join(fromJSON(inputs.terraform-directories), ' ') }}

name: Publish the Gateway API Integrator charm to edge

on:
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - 'gateway-api-integrator/**'

jobs:
  publish-to-edge:
    uses: canonical/charm-ci/.github/workflows/publish-artifacts.yml@58ae6614a3b143d4e57eff0fd1770e97d8c30fab # v1.0.1
    permissions:
      actions: read
      contents: write
    secrets:
      CHARMHUB_TOKEN: ${{ secrets.CHARMHUB_TOKEN }}
    with:
      integration-workflow-name: integration_test.yaml
      working-directory: "."

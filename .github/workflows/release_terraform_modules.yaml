name: Terraform modules release
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/**"
  push:
    branches:
      - main
    paths:
      - "terraform/**"

jobs:
  terraform:
    uses: f-atwi/operator-workflows/.github/workflows/terraform_modules_release.yaml@main
    permissions:
      contents: write
    with:
      check-only: ${{ github.event_name == 'pull_request' }}
